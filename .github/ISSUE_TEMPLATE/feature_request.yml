name: Feature Request
description: Suggest an idea or enhancement for this project.
title: "[Feature]: <Short description>"
labels: ["enhancement"]
assignees:
  - acgvar
body:
  - type: markdown
    attributes:
      value: "Thank you for suggesting a new feature. Please fill out the form below to provide the necessary context."
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the requested feature.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Problem Statement
      description: What problem does this feature solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
